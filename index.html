
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taylor Swift Song Quiz</title>

    <link rel="stylesheet" href="style.css">
</head>



<body>
    <h1>Taylor Swift Song Quiz</h1>
    <p>Guess all the songs!</p>

    <input type="text" id="guessInput"
           placeholder="Enter a song title">

    <button id="guessButton">Guess</button>
    <button id="giveUpButton">Give Up</button>
    <button id="resetButton">Reset Game</button>
    <p id="guessMessage"></p>

    <p id="score">Score: 0</p>

    <div id="albumGrid"></div>

    <footer>
    <p>Created by Hailey Blewett</p>
    <p>Last updated: October 16, 2026</p>
    </footer>

    <script src="script.js"></script>

    <!-- Album completion popup -->
    <div id="albumPopup" class="albumPopup">
        <div id="albumPopupCard" class="albumPopupCard">
            <p>✦ ALBUM COMPLETED ✦</p>
            <h2 id="albumPopupTitle"></h2>
            <p id="albumPopupCount"></p>
        </div>
    </div>
    
    <!-- Give Up Results Popup -->
    <div id="summaryOverlay" class="summaryOverlay">
        <div class="summaryCard">

            <button class="summaryClose"
                    onclick="minimizeSummary()"
                    aria-label="Close results">×</button>

            <h2>Quiz Results</h2>
            <h3 id="summaryTotal"></h3>

            <div id="summaryAlbums"></div>

        </div>
    </div>

    <!-- Button to reopen results -->
    <button id="reopenSummary"
            onclick="showSummary()"
            style="display:none;">
        View Results
    </button>

</body>
</html>
